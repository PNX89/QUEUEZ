name: CI

# Nothing here needs a credential and nothing here reaches a cloud account.
#
# The offline suite runs the consumer's real rules against a committed session and SQLite, which
# honours the same transaction semantics the claim rests on. The legs that need a broker, a sink
# server or another language get their own jobs as they arrive.
#
# NO `schedule:` in any workflow here, and the capture that reaches the live feed is never run by
# a required job: a build that goes red because somebody else's service is down teaches people
# to ignore red builds.
#
# Third-party actions are pinned by commit, with the version in a comment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # The registry, run rather than described. A compatibility setting nobody has watched reject
  # something is a setting nobody has tested.
  #
  # Redpanda is started with `docker run` rather than as a service container, because the image
  # needs a command and a service container cannot give it one. It is also the command a reader
  # would type, which is worth more than the indirection.
  schema:
    name: one breaking change, two compatibility settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: start the broker and its registry
        run: |
          docker run -d --name queuez-rp -p 19092:19092 -p 18081:18081 \
            docker.redpanda.com/redpandadata/redpanda:v25.2.3 \
            redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M \
            --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:19092 \
            --advertise-kafka-addr PLAINTEXT://127.0.0.1:19092 \
            --schema-registry-addr 0.0.0.0:18081
          # A readiness LOOP rather than a sleep. A fixed wait is either too short on a slow
          # runner or wasted on a fast one, and the failure it produces looks like a bug in the
          # thing being measured.
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18081/subjects >/dev/null; then
              echo "the registry answered after ${attempt} attempts"; exit 0
            fi
            sleep 2
          done
          echo "the registry never became ready"; docker logs queuez-rp | tail -30; exit 1
      - name: offer the same change under BACKWARD and under NONE
        run: uv run python scripts/measure_schema.py
      - name: fail if any measured outcome or transcript has changed
        run: |
          git status --porcelain docs/evidence/schema
          git diff --exit-code -- docs/evidence/schema
          test -z "$(git status --porcelain docs/evidence/schema)"

  # The same consumer against a client-server database. If the atomicity claim were an artefact
  # of an in-process library rather than a property of the design, this is where it would fail.
  sink:
    name: the same rules against a real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: queuez
          POSTGRES_PASSWORD: queuez-demo
          POSTGRES_DB: queuez
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U queuez -d queuez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUEUEZ_POSTGRES: postgresql://queuez:queuez-demo@127.0.0.1:5435/queuez
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: run the consumer against PostgreSQL
        run: uv run --group broker pytest tests_broker -q

  # The same normalisation, written twice, compared line by line. A specification with one
  # implementation is a specification nobody has read.
  #
  # The evidence carries a timing, so this job REGENERATES it and diffs only the summary's
  # `identical` flag rather than the whole file: a wall-clock figure differs on every runner,
  # and a diff that fails for that reason is a diff people learn to ignore.
  conformance:
    name: the same normalisation, written twice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: build the decoder
        run: cargo build --release --manifest-path decoder/Cargo.toml
      - name: run both and compare them line by line
        run: uv run python scripts/measure_conformance.py
      - name: fail if they stopped agreeing or the event count moved
        run: |
          # The two things that are not a timing. If either changes, the exhibit has changed.
          uv run python -c "
          import json, pathlib, sys
          found = json.loads(pathlib.Path('docs/evidence/conformance/summary.json').read_text())
          committed = json.loads(
              __import__('subprocess').run(
                  ['git', 'show', 'HEAD:docs/evidence/conformance/summary.json'],
                  capture_output=True, text=True, check=True).stdout)
          for key in ('identical', 'events'):
              if found[key] != committed[key]:
                  print(f'{key}: {committed[key]!r} committed, {found[key]!r} now', file=sys.stderr)
                  sys.exit(1)
          print('identical and events unchanged')
          "
