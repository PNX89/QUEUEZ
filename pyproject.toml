[project]
name = "queuez"
version = "0.1.0"
description = "Ordering a feed by its sequence and never by its clock, because on a real stream the clock goes backwards"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0.3", "types-pyyaml>=6.0.12.20260815"]
# The broker and the sink. Separate from the default install because the offline suite runs the
# consumer's real rules against SQLite and a committed session, and the claim that it does is
# worth being able to check by reading one file.
#
# NO KAFKA CLIENT HERE, and there was one. `confluent-kafka` was declared and imported by
# nothing: the registry leg speaks to Redpanda over HTTP with urllib and the sink leg speaks to
# PostgreSQL with psycopg. A dependency nothing imports is a claim about the shape of the
# project that the code does not make, and it was installed on two CI legs to be unused.
broker = ["psycopg[binary]>=3.2", "redis>=5.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/queuez"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
files = ["src", "tests", "tests_broker", "scripts", "examples"]
strict = true

[[tool.mypy.overrides]]
# THE PARENT AND THE SUBMODULE, because they are two different errors. The lint job installs the
# dev group alone, so on a clean runner none of these exist at all: that is `import-not-found`,
# not the `attr-defined` you get on a machine where they are installed but ship no types. An
# override naming only a submodule silences the second and not the first, and this repository
# shipped that mistake once already in a sibling.
module = ["redis", "redis.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true
